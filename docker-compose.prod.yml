services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bienetre-dashboard-prod-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      - db
    networks:
      - bienetre_dashboard_prod

  db:
    image: postgres:16
    container_name: bienetre-dashboard-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bienetre_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-bienetre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bienetre_password}
    volumes:
      - bienetre_dashboard_prod_postgres_data:/var/lib/postgresql/data
    networks:
      - bienetre_dashboard_prod

volumes:
  bienetre_dashboard_prod_postgres_data:

networks:
  bienetre_dashboard_prod:
