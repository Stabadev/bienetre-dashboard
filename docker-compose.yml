services:
  db:
    image: postgres:16
    container_name: bienetre-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bienetre_dashboard
      POSTGRES_USER: bienetre
      POSTGRES_PASSWORD: bienetre_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
